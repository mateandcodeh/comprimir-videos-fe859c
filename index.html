<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComprimeVideo · Compresor local</title>
<meta name="theme-color" content="#0d1117">
<style>
:root{--bg: #0d1117;--panel: #161b22;--border:#30363d;--tx: #e6edf3;--sub: #8b949e;--ac: #8b5cf6;--ok:#2f9e6e;--err:#d64545;--warn:#d29922}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);padding:16px;max-width:680px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:6px 0 18px}
h1{font-size:20px}
.sub{font-size:12px;color:var(--sub);flex:1}
.ico{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ac),#6d28d9);display:flex;align-items:center;justify-content:center;font-size:18px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin-bottom:4px}
.card .d{font-size:12.5px;color:var(--sub);margin-bottom:12px;line-height:1.5}
label{display:block;font-size:12.5px;color:var(--sub);margin:10px 0 4px}
input[type=file]{width:100%;padding:12px;border:1px dashed var(--border);border-radius:10px;background:#ffffff;color:#111;font:inherit;font-size:14px}
input[type=number],select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:#ffffff;color:#111;font:inherit;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 16px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--ac),#6d28d9);color:#fff;font:inherit;font-size:15px;cursor:pointer;width:100%}
.btn:disabled{opacity:.5}
.btn.sec{background:transparent;border:1px solid var(--border);color:var(--tx)}
.bar{height:10px;border-radius:99px;background:#0d1117;border:1px solid var(--border);overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),#6d28d9);transition:width .2s}
.info{font-size:13px;background:#0d1117;border:1px solid var(--border);border-radius:12px;padding:12px;margin-top:12px;line-height:1.8}
.info b.ok{color:var(--ok)}.info b.er{color:var(--err)}.info b.wa{color:var(--warn)}
.log{font-family:ui-monospace,monospace;font-size:11.5px;background:#0d1117;border:1px solid var(--border);border-radius:10px;padding:10px;max-height:140px;overflow:auto;margin-top:12px;white-space:pre-wrap}
.hidden{display:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>div{flex:1;min-width:120px}
</style>
<style id="lf-tema">html,body{background:#0d1117 !important;color:#e6edf3 !important;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif !important;font-size:16px !important}</style></head>
<body>
<header>
  <div class="ico">🎬</div>
  <div><h1>ComprimeVideo</h1><span class="sub">Reduce el tamaño de tus videos · 100% en el teléfono (FFmpeg wasm)</span></div>
</header>

<div class="card">
  <h2>1 · Elegí el video</h2>
  <div class="d">El video se procesa localmente con FFmpeg: nunca se sube a internet. La primera vez se descarga el motor (~30 MB) y queda en caché.</div>
  <input type="file" id="fVideo" accept="video/*">
  <div class="info hidden" id="infoVideo"></div>
</div>

<div class="card hidden" id="cardOpt">
  <h2>2 · Opciones de compresión</h2>
  <label>Modo rápido</label>
  <select id="selModo">
    <option value="ligero">🪶 Muy ligero — 480p · calidad media (para WhatsApp)</option>
    <option value="equilibrado" selected>⚖️ Equilibrado — 720p · buena calidad</option>
    <option value="calidad">✨ Alta calidad — 1080p máx. · CRF 23</option>
    <option value="custom">🛠️ Personalizado</option>
  </select>
  <div id="custom" class="hidden">
    <div class="row">
      <div><label>Resolución máxima</label>
        <select id="selRes">
          <option value="640">640p</option>
          <option value="854">854p</option>
          <option value="1280" selected>720p (1280)</option>
          <option value="1920">1080p</option>
          <option value="0">Original (sin cambiar)</option>
        </select></div>
      <div><label>Calidad (CRF: 18 = máx · 35 = mín)</label>
        <input type="number" id="nCrf" value="26" min="18" max="35"></div>
    </div>
    <label><input type="checkbox" id="chkAudio" checked style="width:auto"> Mantener audio</label>
  </div>
  <div style="margin-top:14px">
    <button class="btn" id="bGo">🗜️ Comprimir</button>
    <button class="btn sec hidden" id="bCancel" style="margin-top:8px">⛔ Cancelar</button>
  </div>
  <div class="bar hidden" id="bar"><i id="barI"></i></div>
  <div class="log hidden" id="log"></div>
</div>

<div class="card hidden" id="cardRes">
  <h2>3 · Resultado</h2>
  <div class="info" id="infoRes"></div>
  <div style="margin-top:12px">
    <button class="btn" id="bDown">⬇️ Descargar video comprimido</button>
    <button class="btn sec" id="bAgain" style="margin-top:8px">🔁 Comprimir otro</button>
  </div>
</div>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const MB = b => (b / 1048576).toFixed(1) + ' MB';
let videoFile = null, ffmpeg = null, procesando = false, blobSalida = null;

function log(m){ $('log').classList.remove('hidden'); $('log').textContent += m + '\n'; $('log').scrollTop = $('log').scrollHeight; }

$('fVideo').onchange = e => {
  videoFile = e.target.files[0];
  blobSalida = null;
  $('cardRes').classList.add('hidden');
  if (!videoFile) return;
  const url = URL.createObjectURL(videoFile);
  const v = document.createElement('video');
  v.preload = 'metadata';
  v.onloadedmetadata = () => {
    duracion = v.duration || 0;
    $('infoVideo').classList.remove('hidden');
    $('infoVideo').innerHTML = '📹 <b>' + videoFile.name + '</b><br>' +
      'Tamaño original: <b>' + MB(videoFile.size) + '</b><br>' +
      'Resolución: <b>' + v.videoWidth + '×' + v.videoHeight + '</b> · Duración: <b>' + Math.round(v.duration) + ' s</b>' +
      (videoFile.size > 400 * 1048576 ? '<br><b class="wa">⚠️ El video supera 400 MB: en algunos teléfonos puede fallar por falta de memoria. Si pasa, probá cortarlo primero.</b>' : '');
    URL.revokeObjectURL(url);
    $('cardOpt').classList.remove('hidden');
  };
  v.onerror = () => { $('infoVideo').classList.remove('hidden'); $('infoVideo').innerHTML = '<b class="er">No se pudo leer el video (formato no soportado).</b>'; };
  v.src = url;
};

$('selModo').onchange = () => $('custom').classList.toggle('hidden', $('selModo').value !== 'custom');

function opciones(){
  const m = $('selModo').value;
  if (m === 'ligero')     return { res: 854,  crf: 30, audio: true };
  if (m === 'equilibrado')return { res: 1280, crf: 26, audio: true };
  if (m === 'calidad')    return { res: 1920, crf: 23, audio: true };
  return { res: +$('selRes').value, crf: Math.min(35, Math.max(18, +$('nCrf').value || 26)), audio: $('chkAudio').checked };
}

$('bGo').onclick = async () => {
  if (!videoFile || procesando) return;
  procesando = true;
  $('bGo').disabled = true; $('bCancel').classList.remove('hidden');
  $('cardRes').classList.add('hidden');
  $('log').textContent = ''; $('barI').style.width = '0%';
  const opt = opciones();
  const esMp4 = /\.(mp4|m4v|mov)$/i.test(videoFile.name);
  const entrada = esMp4 ? 'entrada.mp4' : 'entrada.' + (videoFile.name.split('.').pop() || 'mkv');
  try {
    if (!ffmpeg) {
      log('Descargando motor FFmpeg (solo la primera vez)…');
      ffmpeg = FFmpeg.createFFmpeg({
        log: false,
        corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js',
        wasmPath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.wasm',
      });
      ffmpeg.setLogger(({ type, message }) => {
        const p = message.match(/time=(\d+):(\d+):([\d.]+)/);
        if (p && duracion > 0) {
          const t = (+p[1]) * 3600 + (+p[2]) * 60 + (+p[3]);
          $('barI').style.width = Math.min(99, Math.round(t / duracion * 100)) + '%';
        }
      });
      await ffmpeg.load();
      log('✓ Motor listo');
    }
    ffmpeg.FS('writeFile', entrada, await FFmpeg.fetchFile(videoFile));
    const args = ['-i', entrada];
    if (opt.res > 0) args.push('-vf', 'scale=-2:' + Math.round(opt.res));
    args.push('-c:v', 'libx264', '-crf', String(opt.crf), '-preset', 'veryfast', '-movflags', '+faststart');
    if (opt.audio) args.push('-c:a', 'aac', '-b:a', '96k'); else args.push('-an');
    args.push('salida.mp4');
    log('Comprimiendo… (puede tardar varios minutos según el video)');
    $('bar').classList.remove('hidden');
    await ffmpeg.run(...args);
    const data = ffmpeg.FS('readFile', 'salida.mp4');
    blobSalida = new Blob([data.buffer], { type: 'video/mp4' });
    ffmpeg.FS('unlink', entrada); ffmpeg.FS('unlink', 'salida.mp4');
    const ahorro = (1 - blobSalida.size / videoFile.size) * 100;
    $('cardRes').classList.remove('hidden');
    $('infoRes').innerHTML =
      'Antes: <b>' + MB(videoFile.size) + '</b> → Después: <b class="ok">' + MB(blobSalida.size) + '</b><br>' +
      'Ahorro: <b class="ok">' + ahorro.toFixed(0) + '%</b>' + (ahorro < 0 ? ' <span class="er">(salió más grande: subí el CRF o bajá la resolución)</span>' : '');
    $('barI').style.width = '100%';
    log('✓ Listo');
  } catch (e) {
    log('✗ ' + (e.message || e));
    alert('Error al comprimir: ' + (e.message || e) + '\n\nSi el video es muy grande, probá el modo "Muy ligero" o un video más corto.');
  }
  procesando = false;
  $('bGo').disabled = false; $('bCancel').classList.add('hidden');
};

let duracion = 0;
$('bCancel').onclick = () => {
  if (ffmpeg) { try { ffmpeg.exit(); } catch (e) {} ffmpeg = null; }
  procesando = false; $('bGo').disabled = false; $('bCancel').classList.add('hidden');
  log('⛔ Cancelado');
};

$('bDown').onclick = () => {
  if (!blobSalida) return;
  const u = URL.createObjectURL(blobSalida);
  const a = document.createElement('a');
  a.href = u; a.download = 'video_comprimido.mp4';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 15000);
};
$('bAgain').onclick = () => {
  $('cardRes').classList.add('hidden'); $('cardOpt').classList.add('hidden'); $('infoVideo').classList.add('hidden');
  $('fVideo').value = ''; videoFile = null; blobSalida = null;
};
</script>
</body>
</html>
